# tmux/tmux.conf
#
# Esta es la base deliberadamente pequeña de tmux. Existe para que cualquier
# comportamiento configurado pueda localizarse y entenderse rápidamente. No
# contiene preferencias de terminal, tema, plugins ni automatizaciones.

# Prefijo
# Usamos Ctrl+a para conservar un atajo corto y consistente al trabajar con
# varias sesiones. Modifica este bloque solo si se decide cambiar el contrato
# de atajos documentado; desasignar Ctrl+b evita dos prefijos equivalentes.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Paneles
# | y - hacen visibles las dos direcciones de división sin depender del
# emulador. Cambia estos atajos únicamente si entran en conflicto con un flujo
# de trabajo probado; quitar % y " evita mantener dos convenciones para la
# misma acción.
unbind %
unbind '"'
bind | split-window -h
bind - split-window -v

# Navegación entre paneles
# h, j, k y l funcionan igual en terminales locales, remotos y sin soporte
# fiable para combinaciones Alt. Modifica este bloque solo como una decisión
# global de ergonomía; mantener una sola familia de teclas evita atajos
# difíciles de recordar o de transportar.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Recarga explícita
# r permite probar cambios sin cerrar sesiones. La ruta XDG será el único
# destino instalado por el bootstrap futuro; no se usa la configuración
# heredada. Cambia esta ruta solo si cambia el contrato de instalación, para
# evitar que se recargue por error un archivo distinto al versionado.
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux configuration reloaded'

# Historial y ratón
# 50 000 líneas ofrece contexto suficiente sin convertir cada panel en un
# almacén ilimitado. El ratón facilita seleccionar paneles, redimensionar y
# revisar historial en terminales modernos; desactívalo aquí si interfiere con
# una aplicación concreta, no en la configuración del emulador.
set -g history-limit 50000
set -g mouse on
